<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#071526">

<title>Wo ist Josi?</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap"
      rel="stylesheet">

<style>

/************************************************************
RESET
************************************************************/

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #071526;

  font-family: 'Barlow', sans-serif;

}

/************************************************************
BODY
************************************************************/

body {

  display: flex;
  flex-direction: column;

  color: #e8f4f8;

}

/************************************************************
HEADER
************************************************************/

header {

  z-index: 1000;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:
    rgba(7,21,38,0.88);

  backdrop-filter: blur(10px);

  border-bottom:
    1px solid rgba(0,180,200,0.15);

}

.logo {

  display: flex;
  align-items: baseline;
  gap: 10px;

}

.logo-main {

  font-family: 'Bebas Neue', sans-serif;

  font-size: 2.2rem;

  letter-spacing: 0.08em;

}

.logo-sub {

  font-size: 0.7rem;

  color: #00b4c8;

  letter-spacing: 0.22em;

}

/************************************************************
STATUS
************************************************************/

.status-pill {

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 6px 12px;

  border:
    1px solid rgba(0,180,200,0.3);

  border-radius: 999px;

  font-size: 0.72rem;

  color: #7a9db5;

}

.status-dot {

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #00b4c8;

  animation: pulse 2s infinite;

}

@keyframes pulse {

  0%,100% {

    opacity: 1;

  }

  50% {

    opacity: 0.4;

  }

}

/************************************************************
MAP WRAPPER
************************************************************/

.map-wrapper {

  flex: 1;

  display: flex;
  flex-direction: column;

  padding: 10px;

  min-height: 0;

}

/************************************************************
LABEL
************************************************************/

.map-label {

  font-size: 0.58rem;

  letter-spacing: 0.18em;

  color: #007d8c;

  margin-bottom: 8px;

  text-transform: uppercase;

}

/************************************************************
MAP CONTAINER
************************************************************/

.map-container {

  position: relative;

  flex: 1;

  min-height: 0;

  border-radius: 10px;

  overflow: hidden;

  border:
    1px solid rgba(0,180,200,0.2);

  box-shadow:
    0 10px 40px rgba(0,0,0,0.45);

}

/************************************************************
MAP
************************************************************/

#map {

  width: 100%;
  height: 100%;

}

/************************************************************
LEAFLET
************************************************************/

.leaflet-container {

  background: #071526;

  touch-action: pan-x pan-y;

}

/************************************************************
FOOTER
************************************************************/

footer {

  padding:
    10px
    18px
    calc(10px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 0.62rem;

  color: #7a9db5;

  background:
    rgba(7,21,38,0.7);

  border-top:
    1px solid rgba(0,180,200,0.1);

}

/************************************************************
MOBILE
************************************************************/

@media (max-width: 768px) {

  .logo-main {

    font-size: 1.6rem;

  }

  .logo-sub {

    font-size: 0.58rem;

  }

  .status-pill {

    display: none;

  }

  footer {

    flex-direction: column;

    gap: 4px;

    text-align: center;

  }

}

/************************************************************
LANDSCAPE MOBILE
************************************************************/

@media (max-width: 950px) and (orientation: landscape) {

  header {

    padding:
      calc(8px + env(safe-area-inset-top))
      14px
      8px;

  }

  .logo-main {

    font-size: 1.2rem;

  }

  .map-wrapper {

    padding: 6px;

  }

  .map-label {

    margin-bottom: 5px;

    font-size: 0.48rem;

  }

  footer {

    display: none;

  }

}

</style>

</head>

<body>

<header>

  <div class="logo">

    <span class="logo-main">
      WO IST JOSI?
    </span>

    <span class="logo-sub">
      LIVE TRACKING
    </span>

  </div>

  <div class="status-pill">

    <span class="status-dot"></span>

    AIS LIVE

  </div>

</header>

<main class="map-wrapper">

  <div class="map-label">
    ⚓ AKTUELLE POSITION — MMSI 218007170
  </div>

  <div class="map-container">

    <div id="map"></div>

  </div>

</main>

<footer>

  <span>woistjosi.de</span>

  <span>OpenStreetMap • AIS Tracking</span>

</footer>

<script>

/************************************************************
ZOOM
************************************************************/

const mobile = window.innerWidth < 768;

const zoomLevel = mobile ? 7 : 6;

/************************************************************
MAP
************************************************************/

const map = L.map('map').setView(

  [47.0, -4.0],

  zoomLevel

);

/************************************************************
TILES
************************************************************/

L.tileLayer(

  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

  {

    maxZoom: 18,

    attribution:
      '&copy; OpenStreetMap contributors'

  }

).addTo(map);

/************************************************************
BOAT ICON
************************************************************/

const boatIcon = L.divIcon({

  className: '',

  html: `
    <div style="
      width:18px;
      height:18px;
      background:#00b4c8;
      border-radius:50%;
      box-shadow:
        0 0 12px rgba(0,180,200,0.9),
        0 0 24px rgba(0,180,200,0.4);
    "></div>
  `,

  iconSize: [18,18],

  iconAnchor: [9,9]

});

/************************************************************
MARKER
************************************************************/

L.marker(

  [47.0, -4.0],

  {

    icon: boatIcon

  }

).addTo(map);

/************************************************************
FIX FOR RESIZE / ROTATION
************************************************************/

window.addEventListener('resize', () => {

  setTimeout(() => {

    map.invalidateSize();

  }, 200);

});

</script>

</body>
</html>
