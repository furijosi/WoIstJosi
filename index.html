<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">

  <!-- MOBILE OPTIMIERT -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 viewport-fit=cover">

  <!-- APP STYLE -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#071526">

  <title>Wo ist Josi?</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap"
        rel="stylesheet">

  <style>

    /************************************************************
    RESET
    ************************************************************/

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #071526;

      font-family: 'Barlow', sans-serif;

      -webkit-text-size-adjust: 100%;

    }

    :root {

      --deep: #071526;
      --teal: #00b4c8;
      --teal-dim: #007d8c;
      --white: #e8f4f8;
      --muted: #7a9db5;

    }

    /************************************************************
    BODY
    ************************************************************/

    body {

      display: flex;
      flex-direction: column;

      color: var(--white);

    }

    body::before {

      content: '';

      position: fixed;
      inset: 0;

      background:

        radial-gradient(
          ellipse 80% 50% at 20% 80%,
          rgba(0,180,200,0.07) 0%,
          transparent 60%
        ),

        radial-gradient(
          ellipse 60% 40% at 80% 20%,
          rgba(0,100,160,0.08) 0%,
          transparent 55%
        );

      pointer-events: none;

      z-index: 0;

    }

    /************************************************************
    HEADER
    ************************************************************/

    header {

      position: relative;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;

      background:
        rgba(7,21,38,0.88);

      backdrop-filter: blur(10px);

      border-bottom:
        1px solid rgba(0,180,200,0.15);

    }

    .logo {

      display: flex;
      align-items: baseline;
      gap: 10px;

    }

    .logo-main {

      font-family: 'Bebas Neue', sans-serif;

      font-size: 2.2rem;

      letter-spacing: 0.08em;

    }

    .logo-sub {

      font-size: 0.7rem;

      color: var(--teal);

      letter-spacing: 0.22em;

    }

    /************************************************************
    STATUS
    ************************************************************/

    .status-pill {

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 6px 12px;

      border:
        1px solid rgba(0,180,200,0.3);

      border-radius: 999px;

      font-size: 0.72rem;

      color: var(--muted);

    }

    .status-dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--teal);

      animation: pulse 2s infinite;

    }

    @keyframes pulse {

      0%,100% {

        opacity: 1;

      }

      50% {

        opacity: 0.4;

      }

    }

    /************************************************************
    MAP WRAPPER
    ************************************************************/

    .map-wrapper {

      position: relative;
      z-index: 5;

      flex: 1;

      display: flex;
      flex-direction: column;

      padding: 10px;

      min-height: 0;

    }

    /************************************************************
    LABEL
    ************************************************************/

    .map-label {

      font-size: 0.58rem;

      letter-spacing: 0.18em;

      color: var(--teal-dim);

      margin-bottom: 8px;

      text-transform: uppercase;

    }

    /************************************************************
    MAP CONTAINER
    ************************************************************/

    .map-container {

      position: relative;

      flex: 1;

      min-height: 0;

      border-radius: 10px;

      overflow: hidden;

      border:
        1px solid rgba(0,180,200,0.2);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.45);

      background: #071526;

    }

    /************************************************************
    VESSELFINDER
    ************************************************************/

    #vfmap {

      width: 100%;
      height: 100%;

      min-height: 400px;

    }

    /************************************************************
    POPUPS AUSBLENDEN
    ************************************************************/

    .leaflet-popup-pane,
    .leaflet-popup,
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip-container,
    .leaflet-popup-close-button,
    [class*="popup"],
    [class*="Popup"],
    [class*="vessel-info"],
    [class*="ship-info"],
    [class*="vf-info"] {

      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;

    }

    /************************************************************
    FOOTER
    ************************************************************/

    footer {

      position: relative;
      z-index: 1000;

      padding:
        10px
        18px
        calc(10px + env(safe-area-inset-bottom));

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 0.62rem;

      color: var(--muted);

      background:
        rgba(7,21,38,0.7);

      border-top:
        1px solid rgba(0,180,200,0.1);

    }

    footer a {

      color: var(--teal-dim);
      text-decoration: none;

    }

    /************************************************************
    MOBILE
    ************************************************************/

    @media (max-width: 768px) {

      .logo-main {

        font-size: 1.6rem;

      }

      .logo-sub {

        font-size: 0.58rem;

      }

      .status-pill {

        display: none;

      }

      footer {

        flex-direction: column;

        gap: 4px;

        text-align: center;

      }

    }

    /************************************************************
    LANDSCAPE MOBILE
    ************************************************************/

    @media (max-width: 950px) and (orientation: landscape) {

      header {

        padding:
          calc(8px + env(safe-area-inset-top))
          14px
          8px;

      }

      .logo-main {

        font-size: 1.2rem;

      }

      .map-wrapper {

        padding: 6px;

      }

      .map-label {

        margin-bottom: 5px;

        font-size: 0.48rem;

      }

      footer {

        display: none;

      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">

      <span class="logo-main">
        WO IST JOSI?
      </span>

      <span class="logo-sub">
        LIVE TRACKING
      </span>

    </div>

    <div class="status-pill">

      <span class="status-dot"></span>

      AIS LIVE

    </div>

  </header>

  <!-- MAP -->

  <main class="map-wrapper">

    <div class="map-label">
      ⚓ AKTUELLE POSITION — MMSI 218007170
    </div>

    <div class="map-container">

      <div id="vfmap"></div>

      <!-- VESSELFINDER -->

      <script type="text/javascript">

        const mobile = window.innerWidth < 768;

        var width      = "100%";
        var height     = "100%";

        var mmsi       = "218007170";

        var show_track = true;

        var names      = false;

        /* Desktop weiter raus */
        var zoom       = mobile ? 7 : 6;

      </script>

      <script
        type="text/javascript"
        src="https://www.vesselfinder.com/aismap.js">
      </script>

      <!-- POPUP ENTFERNEN -->

      <script>

        function removeVFPopups() {

          document.querySelectorAll(

            '.leaflet-popup-pane,' +
            '.leaflet-popup,' +
            '[class*="popup"],' +
            '[class*="Popup"],' +
            '[class*="vessel-info"],' +
            '[class*="ship-info"],' +
            '[class*="vf-info"]'

          ).forEach(el => {

            el.style.display = 'none';
            el.style.visibility = 'hidden';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';

          });

          document.querySelectorAll(

            '.leaflet-marker-icon'

          ).forEach(el => {

            el.style.pointerEvents = 'none';

          });

        }

        /* dauerhaft prüfen */
        setInterval(removeVFPopups, 500);

      </script>

    </div>

  </main>

  <!-- FOOTER -->

  <footer>

    <span>woistjosi.de</span>

    <span>

      Kartendaten:
      <a href="https://www.vesselfinder.com"
         target="_blank"
         rel="noopener">

        VesselFinder

      </a>

    </span>

  </footer>

</body>
</html>
