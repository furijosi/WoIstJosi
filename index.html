<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wo ist Josi?</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --deep: #071526;
      --teal: #00b4c8;
      --teal-dim: #007d8c;
      --white: #e8f4f8;
      --muted: #7a9db5;
    }

    body {
      background: var(--deep);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(0,180,200,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(0,100,160,0.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 22px 32px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,180,200,0.15);
      background: rgba(7,21,38,0.85);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .logo-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      color: var(--white);
      line-height: 1;
    }

    .logo-sub {
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 500;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(0,180,200,0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.75);
      }
    }

    .map-wrapper {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
    }

    .map-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--teal-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .map-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(0,180,200,0.25), transparent);
    }

    .map-container {
      flex: 1;
      min-height: 520px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0,180,200,0.2);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Alle VesselFinder Popups verstecken */
    .leaflet-popup-pane,
    .leaflet-popup,
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip-container,
    .leaflet-popup-close-button {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Corner Decorations */
    .map-container::before,
    .map-container::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--teal);
      border-style: solid;
      z-index: 999;
      pointer-events: none;
    }

    .map-container::before {
      top: 8px;
      left: 8px;
      border-width: 2px 0 0 2px;
    }

    .map-container::after {
      bottom: 8px;
      right: 8px;
      border-width: 0 2px 2px 0;
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 14px 32px;
      border-top: 1px solid rgba(0,180,200,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      background: rgba(7,21,38,0.6);
    }

    footer a {
      color: var(--teal-dim);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--teal);
    }

    @media (max-width: 600px) {

      header {
        padding: 16px 18px;
      }

      .logo-main {
        font-size: 1.8rem;
      }

      .status-pill {
        display: none;
      }

      .map-wrapper {
        padding: 16px 14px;
      }

      .map-container {
        min-height: 380px;
      }

      footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="logo">
      <span class="logo-main">WO IST JOSI?</span>
      <span class="logo-sub">Live-Tracking</span>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      AIS Echtzeit
    </div>

  </header>

  <main class="map-wrapper">

    <div class="map-label">
      ⚓ Aktuelle Position — MMSI 218007170
    </div>

    <div class="map-container">

      <script type="text/javascript">

        var width      = "100%";
        var height     = "520";

        var mmsi       = "218007170";

        var show_track = true;
        var names      = false;

        /* weiter herausgezoomt */
        var zoom       = 6;

      </script>

      <script
        type="text/javascript"
        src="https://www.vesselfinder.com/aismap.js">
      </script>

      <script>

        function removeVFPopups() {

          /* Alle Popup Elemente entfernen */
          document.querySelectorAll('.leaflet-popup-pane').forEach(el => {
            el.remove();
          });

          document.querySelectorAll('.leaflet-popup').forEach(el => {
            el.remove();
          });

          /* Klicks auf Schiffsmarker deaktivieren */
          document.querySelectorAll('.leaflet-marker-icon').forEach(el => {
            el.style.pointerEvents = 'none';
          });

        }

        /* dauerhaft ausführen weil VesselFinder dynamisch nachlädt */
        setInterval(removeVFPopups, 500);

      </script>

    </div>

  </main>

  <footer>

    <span>woistjosi.de</span>

    <span>
      Kartendaten:
      <a href="https://www.vesselfinder.com"
         target="_blank"
         rel="noopener">
        VesselFinder
      </a>
    </span>

  </footer>

</body>
</html>
